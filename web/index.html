body{background:radial-gradient(900px 420px at 50% -8%,#1c2438 0,transparent 62%),var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

#root{max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.2px}
.ghost{color:var(--mute);padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.ghost:active{background:var(--panel)}

.hero{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:20px 18px 16px}
.eyebrow{color:var(--mute);font-size:13px}
.total{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;cursor:pointer;width:100%;text-align:start}
.total .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.15}
.total .s{color:var(--accent);font-size:16px}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mute);background:rgba(255,255,255,.02)}
.pill b{color:var(--ink);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.seg button{padding:5px 14px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.banner{margin-top:14px;border:1px dashed var(--accent);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.banner button{align-self:flex-start;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.act svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act:active{background:var(--panel2)}

h2{font-family:var(--display);font-size:18px;font-weight:700;margin:24px 0 10px}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:92px}
.w .n{font-size:14px;color:var(--mute)}
.w .b{font-size:19px;font-weight:600;margin-top:auto}
.w .c{font-size:12px;color:var(--accent)}
.w .d{font-size:12px;color:var(--mute)}
.gold{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.gold .gv{font-size:17px;font-weight:600;margin:2px 0;display:flex;gap:8px;flex-wrap:wrap}
.gold .gl{text-align:start;padding:0}
.planline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.planline s{font-family:var(--display);font-size:22px;color:var(--mute);text-decoration:none}
.planline s .num{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.planline .cur{color:var(--mute);font-size:14px}
.planline .pt{font-size:13px;color:var(--accent);font-weight:600}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.resbox{border:1px dashed var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:48px}
.w.wide{width:100%;min-height:64px}
.gbox{display:flex;flex-direction:column;gap:12px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 6px}
.prices div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.prices b{font-weight:600;font-size:15px}
.w.add{align-items:center;justify-content:center;color:var(--mute);border-style:dashed;font-size:14px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;text-align:start;width:100%;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .t{font-size:15px}
.tx .d{font-size:12px;color:var(--mute)}
.tx .a{font-weight:600;font-size:15px;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .neu{color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--mute);font-size:14px}
.foot{display:flex;gap:10px;margin-top:22px}
.foot .ghost{flex:1;text-align:center}

/* lock */
#lock{position:fixed;inset:0;z-index:20;background:radial-gradient(700px 420px at 50% 18%,#1d2640 0,transparent 65%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.emblem{width:132px;height:132px}
.emblem .r{fill:none;stroke:var(--accent)}
.emblem .spin{transform-origin:60px 60px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{font-family:var(--display);font-size:22px;font-weight:700;text-align:center}
.ls{color:var(--mute);font-size:14px;min-height:22px;text-align:center}
.ls.err{color:var(--neg)}
.dots{display:flex;gap:12px;direction:ltr;margin:4px 0 6px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--mute)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;direction:ltr}
.pad button{height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:24px;font-family:var(--body)}
.pad button:active{background:var(--panel2)}
.pad .x{background:none;border-color:transparent;font-size:15px;color:var(--mute)}
.bio{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;padding:10px 18px;border:1px solid var(--accent);border-radius:999px}
.bio svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:10;background:rgba(4,6,10,.7);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px max(24px,env(safe-area-inset-bottom))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh h3{font-family:var(--display);font-size:19px}
.sh button{color:var(--mute);font-size:22px;padding:2px 10px}
#sheetBody{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.lbl{font-size:14px;color:var(--mute)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font-size:16px;width:100%}
textarea{min-height:90px;resize:vertical;direction:ltr;font-size:12px}
.amt{display:flex;align-items:center;gap:8px}
.amt span{color:var(--accent);min-width:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mute)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600;text-align:center;background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:#5a2c33}
.btn.wide{width:100%}
.hint{font-size:13px;color:var(--mute)}
.hint b{color:var(--ink);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sep{height:1px;background:var(--line);margin:4px 0}
#toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.emblem .spin,.shake{animation:none}}
</style>
</head>
<body>
<div id="root"></div>

<div id="lock" role="dialog" aria-label="قفل التطبيق"></div>

<div id="sheetWrap" hidden>
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sh"><h3 id="sheetTitle"></h3><button data-act="closeSheet" aria-label="إغلاق">×</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
const LS='wlt_state_v1', LSC='wlt_cred_v1';
const CUR={AED:'د.إ',EGP:'ج.م',GOLD:'جم'};
const GOLD_DEFAULT=486.6;
const RATE_DEFAULT=14.67, GOLD_EGP_DEFAULT=7130, PRICES_AT='2026-11-10'; // AED per gram of 24k gold, early Nov 2026 (editable in settings)
const CATS_OUT=['أكل','مواصلات','سكن','فواتير','تسوق','صحة','ترفيه','أخرى'];
const CATS_IN=['راتب','مكافأة','هدية','أخرى'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const s=String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,\s٬]/g,'');const n=parseFloat(s);return isFinite(n)?n:NaN;};
const fmt=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const rfmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:4}).format(n);
const gfmt=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:3}).format(n);
const money=(c,n)=>c==='GOLD'?gfmt(n)+' جم':fmt(n)+' '+CUR[c];
const N=(t,c)=>`<span class="num${c?' '+c:''}">${t}</span>`;
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const dshow=ts=>new Date(ts).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short'});

let state=null, mode='loading', buf='', first='', changing=false, reveal=false, bioOK=false;
let errMsg='', shakeNow=false, dbDoc=null, fails=0, lockUntil=0, liveFn=null, idleT=null, saveT=null, toastT=null;

/* ---------- state ---------- */
const newState=()=>({v:1,pin:null,wallets:[],txs:[],rate:RATE_DEFAULT,base:'AED',gold:GOLD_DEFAULT,goldEGP:GOLD_EGP_DEFAULT,goldAt:PRICES_AT,pricesV2:true,incGold:true,demo:false,updatedAt:0});
const gp=()=>(state.gold>0?state.gold:0);
const gpEGP=()=>state.goldEGP>0?state.goldEGP:gp()*(state.rate||1);
function migrate(s){
  if(!s) return s;
  if(s.gold==null){s.gold=GOLD_DEFAULT;s.goldAt=PRICES_AT;s.incGold=true}
  if(!s.pricesV2){ // refresh the placeholder prices once; keep anything the user typed
    s.pricesV2=true;
    if(!(s.goldEGP>0)){s.goldEGP=GOLD_EGP_DEFAULT;s.goldAt=PRICES_AT}
    if(s.rate===13){s.rate=RATE_DEFAULT}
    if(s.gold===486){s.gold=GOLD_DEFAULT}
  }
  if(!s.goldPrompted&&s.pin){ // one-time: give existing wallets a gold wallet to fill in
    s.goldPrompted=true;
    if(!s.wallets.some(w=>w.cur==='GOLD')) s.wallets.push({id:'gold1',name:'سبائك دهب',cur:'GOLD',open:0});
  }
  return s;
}
function seedDemo(){
  const d=86400000, n=Date.now();
  state.wallets=[
    {id:'w1',name:'كاش درهم',cur:'AED',open:1000},
    {id:'w2',name:'بنك الإمارات',cur:'AED',open:0},
    {id:'w3',name:'كاش جنيه',cur:'EGP',open:6000},
    {id:'w4',name:'بنك مصر',cur:'EGP',open:20000},
    {id:'gold1',name:'سبائك دهب',cur:'GOLD',open:100}
  ];
  state.goldPrompted=true;
  state.txs=[
    {id:uid(),ts:n-9*d,type:'in',w:'w2',amt:14000,cat:'راتب',note:''},
    {id:uid(),ts:n-8*d,type:'out',w:'w2',amt:3200,cat:'سكن',note:'إيجار'},
    {id:uid(),ts:n-6*d,type:'move',w:'w2',to:'w4',amt:2000,toAmt:26400,note:'تحويل لمصر'},
    {id:uid(),ts:n-4*d,type:'move',w:'w2',to:'w1',amt:500,toAmt:500,note:''},
    {id:uid(),ts:n-3*d,type:'out',w:'w1',amt:380,cat:'أكل',note:'سوبرماركت'},
    {id:uid(),ts:n-1*d,type:'out',w:'w3',amt:450,cat:'مواصلات',note:''}
  ];
  state.demo=true;
}
function loadLocal(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ if(dbDoc){ try{ dbDoc.set({json:JSON.stringify(state),updatedAt:state.updatedAt}); }catch(e){} } },700);
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const user=await window.claude.use('user'); const db=await window.claude.use('db');
    if(!user||!db) return;
    const id=await user.id();
    dbDoc=db.collection('data/users/'+id).doc('wallet');
    const snap=await dbDoc.get();
    const ex=typeof snap.exists==='function'?snap.exists():snap.exists;
    if(!ex) { if(state&&state.pin) persist(); return; }
    const d=typeof snap.data==='function'?snap.data():snap;
    if(d&&d.json&&d.updatedAt>((state&&state.updatedAt)||0)){
      state=migrate(JSON.parse(d.json));
      try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
      if(mode.startsWith('setup')||mode==='loading'){mode='lock';buf='';}
      render();
    } else if(state&&state.pin&&(!d||d.updatedAt<state.updatedAt)) persist();
  }catch(e){}
}

/* ---------- money ---------- */
const eff=t=>t.type==='in'||t.type==='adjust'?[[t.w,t.amt]]:t.type==='out'?[[t.w,-t.amt]]:[[t.w,-t.amt],[t.to,t.toAmt]];
const getW=id=>state.wallets.find(w=>w.id===id);
const bal=w=>state.txs.reduce((s,t)=>s+eff(t).reduce((a,[id,d])=>a+(id===w.id?d:0),0),w.open);
const toAED=(c,a)=>c==='AED'?a:c==='EGP'?a/(state.rate||1):a*gp();
const fromAED=(c,a)=>c==='AED'?a:c==='EGP'?a*(state.rate||1):(gp()>0?a/gp():0);
function totals(){
  const s={AED:0,EGP:0,GOLD:0}; state.wallets.forEach(w=>{s[w.cur]=(s[w.cur]||0)+bal(w)});
  const goldAED=s.GOLD*gp();
  const inc=state.incGold!==false;
  const goldEGPv=s.GOLD*gpEGP();
  const total=state.base==='AED'?s.AED+s.EGP/(state.rate||1)+(inc?goldAED:0):s.EGP+s.AED*(state.rate||1)+(inc?goldEGPv:0);
  return {s,goldAED,goldEGPv,total};
}
const m=t=>reveal?t:'••••••';
const dlong=ts=>new Date(ts).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:'numeric'});
function planCalc(p){
  const monthly=p.mode==='monthly'?p.amount:p.amount/p.months;
  const total=p.mode==='total'?p.amount:p.amount*p.months;
  const end=new Date(p.startTs||Date.now()); end.setMonth(end.getMonth()+p.months);
  return {monthly,total,end:end.getTime()};
}
function planInfo(){
  const p=state.plan; if(!p||!(p.months>0)||!(p.amount>0)) return null;
  const c=planCalc(p);
  const el=Math.max(0,Math.min(p.months,(Date.now()-p.startTs)/(86400000*30.4375)));
  return {p,monthly:c.monthly,total:c.total,end:c.end,elapsed:el,sofar:c.monthly*el,pct:el/p.months};
}
const planBase=pi=>fromAED(state.base,toAED(pi.p.cur,pi.total));

/* ---------- pin + biometric ---------- */
async function hash(salt,pin){
  try{const b=new TextEncoder().encode(salt+':'+pin);const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let x=5381;for(const c of salt+pin)x=((x<<5)+x+c.charCodeAt(0))|0;return 'f'+x}
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const NB=()=>{try{const c=window.Capacitor;return c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.BiometricAuth||null}catch(e){return null}};
const hasCred=()=>{try{return !!localStorage.getItem(LSC)}catch(e){return false}};
async function checkBio(){
  const nb=NB();
  if(nb){try{const r=await nb.checkBiometry();bioOK=!!(r&&r.isAvailable)}catch(e){bioOK=false}if(mode==='lock')renderLock();return}
  try{bioOK=!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){bioOK=false}
  if(mode==='lock')renderLock();
}
async function enableBio(){
  const nb=NB();
  if(nb){try{await nb.authenticate({reason:'تفعيل البصمة',androidTitle:'AT wallet',cancelTitle:'إلغاء'});localStorage.setItem(LSC,'native');return true}catch(e){return false}}
  try{
    const c=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'AT wallet'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'wallet',displayName:'AT wallet'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000}});
    localStorage.setItem(LSC,b64(c.rawId)); return true;
  }catch(e){return false}
}
async function bioLogin(){
  const nb=NB();
  if(nb){try{await nb.authenticate({reason:'افتح AT wallet',androidTitle:'AT wallet',cancelTitle:'استخدم الرقم السري'});unlock()}catch(e){err('البصمة ما نفعتش. اكتب الرقم السري')}return}
  try{
    const id=localStorage.getItem(LSC);
    const r=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key',id:unb64(id),transports:['internal']}],
      userVerification:'required',timeout:60000}});
    if(r) unlock();
  }catch(e){err('البصمة ما نفعتش. اكتب الرقم السري')}
}

function err(t){errMsg=t;shakeNow=true;renderLock()}
function unlock(){mode='app';buf='';errMsg='';reveal=false;render();resetIdle()}
function lockNow(){
  if(!state||!state.pin) return;
  closeSheet(); changing=false; mode='lock'; buf=''; errMsg=''; reveal=false;
  $('#root').innerHTML=''; renderLock();
}
function resetIdle(){clearTimeout(idleT);if(mode==='app')idleT=setTimeout(lockNow,90000)}

async function pinDone(){
  const pin=buf; buf='';
  if(mode==='lock'){
    if(Date.now()<lockUntil){err('استنى شوية وجرب تاني');return}
    const ok=state.pin&&await hash(state.pin.salt,pin)===state.pin.hash;
    if(ok){fails=0;unlock();return}
    fails++;
    if(fails>=5){fails=0;lockUntil=Date.now()+30000;err('محاولات كتير. استنى 30 ثانية')} else err('الرقم غلط');
    return;
  }
  if(mode==='setup1'||mode==='change1'){first=pin;mode=mode==='setup1'?'setup2':'change2';errMsg='';renderLock();return}
  if(pin!==first){mode=mode==='setup2'?'setup1':'change1';err('الرقمين مش زي بعض. ابدأ تاني');return}
  const salt=uid()+uid(); const was=mode;
  state.pin={salt,hash:await hash(salt,pin)};

    <div class="hint">اختار هتحوش كام والتطبيق يقولك النتيجة. المدة بتبدأ من النهاردة.</div>
    <label>العملة<select id="p_c"><option value="AED"${p.cur==='AED'?' selected':''}>درهم (د.إ)</option><option value="EGP"${p.cur==='EGP'?' selected':''}>جنيه (ج.م)</option></select></label>
    <div class="lbl">هتحدد إيه؟</div>
    <div class="chips" id="p_m"><button type="button" class="chip${p.mode==='monthly'?' on':''}" data-act="pmode" data-v="monthly">مبلغ شهري</button><button type="button" class="chip${p.mode==='total'?' on':''}" data-act="pmode" data-v="total">إجمالي المبلغ</button></div>
    <label><span id="p_al">المبلغ</span><div class="amt"><input id="p_a" inputmode="decimal" value="${p.amount}" placeholder="0.00" autocomplete="off"><span id="p_ac"></span></div></label>
    <label>المدة بالشهور<input id="p_n" inputmode="numeric" value="${p.months}" autocomplete="off"></label>
    <div class="chips">${[6,12,24,36].map(v=>`<button type="button" class="chip" data-act="pmon" data-v="${v}">${v} شهر</button>`).join('')}</div>
    <div class="resbox" id="p_r"></div>
    <button class="btn primary wide" data-act="savePlan">${state.plan?'حفظ التعديل':'ابدأ الخطة من النهاردة'}</button>`,
    ()=>{
      const cur=val('p_c'), mode=(document.querySelector('#p_m .chip.on')||{dataset:{v:'monthly'}}).dataset.v;
      const a=num(val('p_a')), n=Math.round(num(val('p_n')));
      $('#p_ac').textContent=CUR[cur];
      $('#p_al').textContent=mode==='monthly'?'المبلغ الشهري':'إجمالي المبلغ اللي عايز تجمعه';
      const r=$('#p_r');
      if(!(a>0)||!(n>0)||n>600){r.innerHTML='<div class="hint">اكتب المبلغ والمدة وهتظهر النتيجة هنا.</div>';return}
      const c=planCalc({mode,amount:a,months:n,startTs:Date.now()});
      const other=cur==='AED'?'EGP':'AED';
      const after=totals().total+fromAED(state.base,toAED(cur,c.total));
      r.innerHTML=`
        <div class="kv"><span>هتحوش شهرياً</span><b>${N(fmt(c.monthly)+' '+CUR[cur])}</b></div>
        <div class="kv"><span>إجمالي الخطة</span><b>${N(fmt(c.total)+' '+CUR[cur])}</b></div>
        <div class="kv"><span>يعادل</span><b>${N(fmt(fromAED(other,toAED(cur,c.total)))+' '+CUR[other])}</b></div>
        <div class="kv"><span>تنتهي في</span><b>${dlong(c.end)}</b></div>
        <div class="kv"><span>فلوسك بعد الخطة</span><b>${N(fmt(after)+' '+CUR[state.base])}</b></div>`;
    });
}
function savePlan(){
  const cur=val('p_c'), mode=(document.querySelector('#p_m .chip.on')||{dataset:{v:'monthly'}}).dataset.v;
  const a=num(val('p_a')), n=Math.round(num(val('p_n')));
  if(!(a>0)){toast('اكتب المبلغ');return}
  if(!(n>=1&&n<=600)){toast('المدة من 1 لـ 600 شهر');return}
  state.plan={cur,mode,amount:a,months:n,startTs:state.plan?state.plan.startTs:Date.now()};
  commit('اتحفظت خطة التحويش');
}
function fWallet(){
  openSheet('محفظة جديدة',`
    <label>الاسم<input id="n_n" maxlength="30" placeholder="مثال: كاش، بنك، محفظة موبايل"></label>
    <label>العملة<select id="n_c"><option value="AED">درهم إماراتي (د.إ)</option><option value="EGP">جنيه مصري (ج.م)</option><option value="GOLD">ذهب عيار 24 (بالجرام)</option></select></label>
    <label>الرصيد الحالي (للذهب: عدد الجرامات)<input id="n_o" inputmode="decimal" placeholder="0.00" autocomplete="off"></label>
    <button class="btn primary wide" data-act="saveWallet">إضافة</button>`);
}
function saveWallet(){
  const n=val('n_n').trim(), o=num(val('n_o')||'0');
  if(!n||isNaN(o)){toast('اكتب الاسم والرصيد');return}
  state.wallets.push({id:uid(),name:n,cur:val('n_c'),open:o});
  commit('اتضافت المحفظة');
}
function openWallet(id){
  const w=getW(id); if(!w) return;
  const rows=[...state.txs].filter(t=>eff(t).some(([i])=>i===id)).sort((a,b)=>b.ts-a.ts).slice(0,12).map(t=>{
    const v=txView(t); return v?`<button class="tx" data-act="tx" data-id="${t.id}"><div><div class="t">${v.title}</div><div class="d">${v.sub} · ${dshow(t.ts)}</div></div><div class="a ${v.cls}">${v.amt}</div></button>`:'';
  }).join('');
  openSheet(w.name,`
    <div class="kv"><span class="hint">الرصيد</span><b>${N(money(w.cur,bal(w)))}</b></div>
    ${w.cur==='GOLD'?`<div class="kv"><span class="hint">قيمته بسعر النهاردة</span><b>${gp()>0?N(fmt(bal(w)*gp())+' د.إ')+' · '+N(fmt(bal(w)*gpEGP())+' ج.م'):'حدد سعر الجرام'}</b></div>`:''}
    <div class="row2"><button class="btn" data-act="fOut" data-w="${id}">مصروف</button><button class="btn" data-act="fIn" data-w="${id}">دخل</button></div>
    <button class="btn wide" data-act="fAdj" data-w="${id}">مطابقة الرصيد</button>
    <div class="list">${rows||'<div class="empty">مفيش عمليات على المحفظة دي</div>'}</div>
    <button class="btn danger wide" data-act="delWallet" data-id="${id}">حذف المحفظة</button>`);
}
function openTx(id){
  const t=state.txs.find(x=>x.id===id); if(!t) return; const v=txView(t); if(!v) return;
  openSheet('تفاصيل العملية',`
    <div class="kv"><span class="hint">النوع</span><b>${v.title}</b></div>
    <div class="kv"><span class="hint">المحفظة</span><span>${v.sub}</span></div>
    <div class="kv"><span class="hint">المبلغ</span><b class="${v.cls}">${v.amt}</b></div>
    <div class="kv"><span class="hint">التاريخ</span><span>${new Date(t.ts).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}</span></div>
    <button class="btn danger wide" data-act="delTx" data-id="${id}">حذف العملية</button>`);
}
function openSettings(){
  const cred=hasCred();
  openSheet('الإعدادات',`
    <label>سعر الصرف (كام جنيه في الدرهم)<input id="s_r" inputmode="decimal" value="${state.rate}"></label>
    <button class="btn wide" data-act="saveRate">حفظ الأسعار</button>
    <label>سعر جرام الذهب عيار 24 في الإمارات (بالدرهم)<input id="s_g" inputmode="decimal" value="${state.gold>0?state.gold:''}"></label>
    <div class="hint">آخر تحديث: <b>${esc(state.goldAt||'—')}</b>. السعر بيتحدث يدوي، وتقدر تطلب مني أحدثه من السوق. بيتحسب بيهم الإجمالي وقيمة الدهب بس، وعملياتك بتتسجل بالسعر الفعلي اللي كتبته.</div>
    <label>سعر جرام الذهب عيار 24 في مصر (بالجنيه)<input id="s_ge" inputmode="decimal" value="${state.goldEGP>0?state.goldEGP:''}" placeholder="لو فاضي بيتحسب من سعر الإمارات"></label>
    <label>خصم إعادة الشراء % (اختياري)<input id="s_h" inputmode="decimal" value="${state.haircut>0?state.haircut:''}" placeholder="0"></label>
    <div class="hint">استخدمهم في حساب "كل ما أملك بالجنيه". اكتب سعر الجرام اللي المحل أو الشركة هتشتري بيه منك فعلاً، والخصم لو في فرق بين البيع والشراء.</div>
    <button class="btn wide" data-act="togGold">${state.incGold!==false?'الدهب داخل في الإجمالي (دوس عشان تشيله)':'الدهب مش داخل في الإجمالي (دوس عشان تدخله)'}</button>
    <div class="sep"></div>
    ${bioOK?`<button class="btn wide" data-act="${cred?'bioOff':'bioOn'}">${cred?'إيقاف البصمة / Face ID على الجهاز ده':'تفعيل البصمة / Face ID على الجهاز ده'}</button>`:`<div class="hint">البصمة و Face ID مش متاحين هنا. الرقم السري شغال.</div>`}
    <button class="btn wide" data-act="changePin">تغيير الرقم السري</button>
    <div class="sep"></div>
    <button class="btn wide" data-act="backup">نسخ نسخة احتياطية</button>
    <textarea id="s_b" placeholder="النسخة الاحتياطية بتظهر هنا. للاسترجاع الصق نسخة قديمة هنا"></textarea>
    <button class="btn wide" data-act="restore">استرجاع من النص اللي فوق</button>
    <div class="sep"></div>
    <button class="btn danger wide" data-act="resetAll">مسح كل البيانات</button>`);
}
function openAllEGP(){
  const {s}=totals(), r=state.rate||1, cut=(state.haircut>0?state.haircut:0)/100;
  const egp=s.EGP, aed=s.AED*r, perG=gpEGP()*(1-cut), gold=s.GOLD*perG;
  const total=egp+aed+gold, bars=s.GOLD/5;
  const src=state.goldEGP>0?'سعر الذهب في مصر المحفوظ':'محسوب من سعر الإمارات × سعر الصرف';
  openSheet('كل ما أملك بالجنيه',`
    <div class="hint">كأنك بعت الدهب وصرفت الدرهم النهاردة بالأسعار المحفوظة.</div>
    <div class="kv"><span>كاش وبنوك بالجنيه</span><b>${N(fmt(egp)+' ج.م')}</b></div>
    <div class="kv"><span>الدرهم (${N(fmt(s.AED))} × ${N(rfmt(r))})</span><b>${N(fmt(aed)+' ج.م')}</b></div>
    <div class="kv"><span>الدهب (${N(gfmt(s.GOLD))} جم × ${N(fmt(perG))})</span><b>${N(fmt(gold)+' ج.م')}</b></div>
    ${s.GOLD>0?`<div class="hint">يعادل حوالي ${N(rfmt(Math.round(bars*100)/100))} سبيكة من فئة 5 جرام. سعر الجرام: ${src}${cut>0?`، بعد خصم ${N(rfmt(state.haircut))}%`:''}.</div>`:''}
    <div class="sep"></div>
    <div class="kv"><span>الإجمالي بالجنيه المصري</span><b style="font-size:22px;color:var(--accent)">${N(fmt(total))}</b></div>
    <div class="hint">التقدير مش بيشمل مصنعية أو دمغة أو رسوم تحويل. سعر الصرف الفعلي في البنك ممكن يختلف. عدّل الأسعار من الإعدادات.</div>
    <button class="btn wide" data-act="settings">تعديل الأسعار</button>`);
}
const backupJSON=()=>JSON.stringify({v:1,plan:state.plan||null,goldEGP:state.goldEGP||0,haircut:state.haircut||0,wallets:state.wallets,txs:state.txs,rate:state.rate,base:state.base,gold:state.gold,goldAt:state.goldAt,incGold:state.incGold});
function offerBio(){
  openSheet('فتح سريع',`
    <div class="hint">تحب تفتح المحفظة بالبصمة أو Face ID بدل الرقم السري؟ الرقم السري هيفضل بديل.</div>
    <button class="btn primary wide" data-act="bioOn2">فعّل البصمة / Face ID</button>
    <button class="btn wide" data-act="closeSheet">مش دلوقتي</button>`);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const k=e.target.closest('[data-k]'); if(k){key(k.dataset.k);return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const d=a.dataset;
  switch(d.act){
    case 'reveal': reveal=!reveal; render(); break;
    case 'lock': lockNow(); break;
    case 'base': state.base=d.v; persist(); render(); break;
    case 'closeSheet': closeSheet(); break;
    case 'fOut': closeSheet(); fTx('out',d.w); break;
    case 'fIn': closeSheet(); fTx('in',d.w); break;
    case 'fMove': fMove(); break;
    case 'fAdj': closeSheet(); fAdj(d.w); break;
    case 'fWallet': fWallet(); break;
    case 'fPlan': fPlan(); break;
    case 'gupd': a.classList.toggle('on'); break;
    case 'pmode': document.querySelectorAll('#p_m .chip').forEach(c=>c.classList.toggle('on',c===a)); if(liveFn)liveFn(); break;
    case 'pmon': $('#p_n').value=d.v; if(liveFn)liveFn(); break;
    case 'savePlan': savePlan(); break;
    case 'delPlan':
      if(a.dataset.sure){state.plan=null;commit('اتلغت الخطة')}
      else{a.dataset.sure=1;a.textContent='دوس تاني للتأكيد'}
      break;
    case 'cat': document.querySelectorAll('#f_c .chip').forEach(c=>c.classList.toggle('on',c===a)); break;
    case 'saveTx': saveTx(d.type); break;
    case 'saveMove': saveMove(); break;
    case 'saveAdj': saveAdj(); break;
    case 'saveWallet': saveWallet(); break;
    case 'wallet': openWallet(d.id); break;
    case 'tx': closeSheet(); openTx(d.id); break;
    case 'delTx':
      if(a.dataset.sure){state.txs=state.txs.filter(t=>t.id!==d.id);commit('اتحذفت')}
      else{a.dataset.sure=1;a.textContent='دوس تاني للتأكيد'}
      break;
    case 'delWallet':
      if(a.dataset.sure){state.txs=state.txs.filter(t=>t.w!==d.id&&t.to!==d.id);state.wallets=state.wallets.filter(w=>w.id!==d.id);commit('اتحذفت المحفظة')}
      else{a.dataset.sure=1;a.textContent='هتتحذف مع عملياتها. دوس تاني للتأكيد'}
      break;
    case 'clearDemo': state.wallets=[{id:'gold1',name:'سبائك دهب',cur:'GOLD',open:0}];state.txs=[];state.demo=false;commit(); fWallet(); break;
    case 'addGold': {const w={id:uid(),name:'سبائك دهب',cur:'GOLD',open:0};state.wallets.push(w);persist();closeSheet();render();fTx('in',w.id);break}
    case 'settings': openSettings(); break;
    case 'saveRate': {
      const r=num(val('s_r')), g=num(val('s_g')||'0'), ge=num(val('s_ge')||'0'), h=num(val('s_h')||'0');
      if(!(r>0)||isNaN(g)||g<0||isNaN(ge)||ge<0||isNaN(h)||h<0||h>50){toast('اكتب أسعار صحيحة');break}
      if(g!==state.gold||ge!==state.goldEGP) state.goldAt=today();
      state.rate=r;state.gold=g;state.goldEGP=ge;state.haircut=h;commit('اتحفظت الأسعار');break}
    case 'allEGP': openAllEGP(); break;
    case 'togGold': state.incGold=state.incGold===false; commit(state.incGold?'الدهب داخل في الإجمالي':'الدهب خرج من الإجمالي'); break;
    case 'bioOn': case 'bioOn2': {const ok=await enableBio();closeSheet();toast(ok?'اتفعلت البصمة':'الجهاز أو المتصفح منع البصمة هنا. استخدم الرقم السري');break}
    case 'bioOff': try{localStorage.removeItem(LSC)}catch(x){} closeSheet(); toast('اتوقفت البصمة'); break;
    case 'bio': bioLogin(); break;
    case 'changePin': closeSheet(); changing=true; mode='change1'; buf=''; errMsg=''; renderLock(); break;
    case 'cancelChange': changing=false; mode='app'; buf=''; renderLock(); break;
    case 'backup': {
      const j=backupJSON(); const t=$('#s_b'); t.value=j; t.select();
      try{await navigator.clipboard.writeText(j);toast('اتنسخت. احفظها في مكان آمن')}catch(x){toast('حدد النص وانسخه بإيدك')}
      break;}
    case 'restore': {
      try{const o=JSON.parse(val('s_b'));
        if(!Array.isArray(o.wallets)||!Array.isArray(o.txs)) throw 0;
        state.wallets=o.wallets;state.txs=o.txs;state.rate=o.rate>0?o.rate:state.rate;state.base=o.base==='EGP'?'EGP':'AED';if(o.gold>=0){state.gold=o.gold;state.goldAt=o.goldAt||state.goldAt}state.incGold=o.incGold!==false;state.goldEGP=o.goldEGP>0?o.goldEGP:0;state.haircut=o.haircut>0?o.haircut:0;state.plan=(o.plan&&o.plan.months>0&&o.plan.amount>0)?o.plan:null;state.demo=false;
        commit('اتسترجعت البيانات');
      }catch(x){toast('النص ده مش نسخة احتياطية صحيحة')}
      break;}
    case 'resetAll':
      if(a.dataset.sure){state.wallets=[];state.txs=[];state.demo=false;commit('اتمسحت كل البيانات')}
      else{a.dataset.sure=1;a.textContent='هتتمسح كل البيانات. دوس تاني للتأكيد'}
      break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='m_b') e.target.dataset.touched=1;
  if(liveFn&&e.target.closest('#sheetBody')) liveFn();
});
document.addEventListener('change',e=>{
  if(e.target.id==='m_f'||e.target.id==='m_t'){const b=$('#m_b');if(b)delete b.dataset.touched}
  if(liveFn&&e.target.closest('#sheetBody')) liveFn();
});
document.addEventListener('pointerdown',resetIdle);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='app')lockNow()});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* ---------- start ---------- */
state=migrate(loadLocal());
if(state&&state.pin){mode='lock'}
else{state=newState();mode='loading'}
renderLock();
checkBio();
if(mode==='loading'){
  Promise.race([initDb(),new Promise(r=>setTimeout(r,3500))]).then(()=>{
    if(mode==='loading'){mode='setup1';buf='';renderLock()}
  });
} else initDb();
})();
</script>
</body>
</html>
