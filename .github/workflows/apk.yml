name: Build APK
on:
  push:
    branches: [main]
    paths: ['capacitor.config.json', 'package.json', 'scripts/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Point the app at the live web app when Pages is up
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          if curl -fsSL -o /dev/null "${URL}index.html"; then
            echo "Pages is live: the APK loads $URL and updates itself on every push."
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.server={androidScheme:'https',url:process.argv[1]};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))" "$URL"
          else
            echo "Pages is not live yet: the APK uses the bundled copy and will not auto update."
          fi
      - name: Create Android project
        run: npx cap add android
      - name: Launcher icons
        run: bash scripts/android-icons.sh
      - name: Sync web app
        run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AT-wallet-apk
          path: AT-wallet.apk
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AT-wallet.apk --title "AT wallet (latest APK)" \
            --notes "Release APK built from ${GITHUB_SHA::7}. Open this page on your phone and download AT-wallet.apk."
