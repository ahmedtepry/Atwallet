name: Build APK
on:
  push:
    branches: [main]
    paths: ['web/**', 'capacitor.config.json', 'package.json', 'scripts/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Launcher icons
        run: bash scripts/android-icons.sh
      - name: Sync web app
        run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AT-wallet-apk
          path: AT-wallet.apk
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AT-wallet.apk --title "AT wallet (latest APK)" \
            --notes "Release APK built from ${GITHUB_SHA::7}. Open this page on your phone and download AT-wallet.apk."
